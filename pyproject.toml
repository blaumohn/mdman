[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mdman"
version = "0.1.0"
description = "Monochrome terminal reader for Markdown files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.18,<5",
  "rich>=14,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "types-jsonschema",
]

[project.scripts]
mdman = "mdman.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mdman"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true

[tool.ruff]
target-version = "py310"
line-length = 72
indent-width = 4

extend-exclude = [
  ".git",
  ".venv",
  "venv",
  "__pycache__",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "C4",
  "RET",
  "ARG",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "ARG001",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
