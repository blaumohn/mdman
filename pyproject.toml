[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mdman"
version = "0.1.0"
description = "Monochrome terminal reader for Markdown files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rich>=14,<15", "typer>=0.12,<1"]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pylint>=3,<4",
]

[project.scripts]
mdman = "mdman.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mdman"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
